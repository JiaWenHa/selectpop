name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-win:
    name: Build Windows (Portable ZIP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate icons
        run: node scripts/gen-icons.js

      - name: Build native helpers (sendcopy.exe / wininfo.exe)
        run: node scripts/build-helper.js

      # 只发布 Windows 绿色版 ZIP（含 Start-SelectPop.cmd 与 README.txt，
      # 由 build.win.extraFiles 复制进 win-unpacked）。
      - name: Build and publish portable ZIP
        run: pnpm exec electron-builder --win zip --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
