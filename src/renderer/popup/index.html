<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';"
    />
    <title>SelectPop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <div class="card" id="card">
        <header class="head">
          <div class="head-text">
            <div class="head-line">
              <span class="badge" id="source-badge" hidden></span>
              <p class="preview" id="preview"></p>
            </div>
            <p class="meta" id="meta"></p>
          </div>
          <button class="icon-btn close" id="close" type="button" title="关闭 (Esc)" aria-label="关闭">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 4l8 8M12 4l-8 8" />
            </svg>
          </button>
        </header>

        <div class="actions" id="actions" role="toolbar" aria-label="操作"></div>

        <section class="result" id="result" hidden>
          <div class="result-head">
            <span class="result-title" id="result-title"></span>
            <span class="result-sub" id="result-sub"></span>
            <span class="spinner" id="spinner" hidden aria-hidden="true"></span>
          </div>
          <div class="answer" id="answer"></div>
          <div class="notice" id="notice" hidden>
            <span id="notice-text"></span>
            <button class="link" id="notice-action" type="button" hidden></button>
          </div>
          <footer class="result-foot">
            <button class="ghost" id="copy-result" type="button">复制结果</button>
            <button class="ghost" id="retry" type="button" hidden>重试</button>
            <button class="ghost" id="stop" type="button" hidden>停止</button>
            <span class="grow"></span>
            <span class="hint" id="result-hint">Esc 关闭</span>
          </footer>
        </section>

        <div class="toast" id="toast" hidden></div>

        <div class="rz rz-nw" data-dir="nw" title="拖动调整大小" aria-hidden="true"></div>
        <div class="rz rz-ne" data-dir="ne" title="拖动调整大小" aria-hidden="true"></div>
        <div class="rz rz-sw" data-dir="sw" title="拖动调整大小" aria-hidden="true"></div>
        <div class="rz rz-se" data-dir="se" title="拖动调整大小" aria-hidden="true"></div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
