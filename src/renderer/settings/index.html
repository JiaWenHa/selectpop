<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';"
    />
    <title>SelectPop 设置</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 4h14M5 9h9M5 14h14M5 19h6" /></svg>
          </div>
          <div class="brand-text">
            <h1>SelectPop</h1>
            <p>划词助手</p>
          </div>
        </div>

        <nav class="nav" id="nav" aria-label="设置分类"></nav>

        <div class="sidebar-foot">
          <button class="foot-btn" id="open-data" type="button">配置目录</button>
          <button class="foot-btn" id="open-log" type="button">查看日志</button>
        </div>
      </aside>

      <main class="content">
        <header class="content-head">
          <div>
            <h2 id="section-title">常规</h2>
            <p id="section-desc"></p>
          </div>
          <span class="save-state" id="save-state"></span>
        </header>
        <div class="scroll" id="panel"></div>
      </main>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script src="main.js"></script>
  </body>
</html>
